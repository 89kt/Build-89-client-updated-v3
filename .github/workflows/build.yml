name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: for f in *.zip; do unzip -qo "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        run: gradle build --no-daemon
        working-directory: 89-client-v2
      - uses: actions/upload-artifact@v4
        with:
          name: 89-client-v2-jar
          path: 89-client-v2/build/libs/*.jar
